{% extends 'base.html' %}
{% block title %}Профіль користувача{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body">
<h1 class="card-title">Вітаємо, {{ user.username }}!</h1>
<p>Ви успішно увійшли до свого профілю.</p>
<p>Email: {{ user.email }}</p>
<a class="btn btn-outline-primary" href="{{ url_for('users.profile') }}">Налаштування профілю</a>
<a class="btn btn-outline-secondary" href="{{ url_for('users.users_list') }}">Усі користувачі</a>
</div></div>
{% endblock %}
