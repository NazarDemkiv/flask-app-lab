{% extends 'base.html' %}

{% block title %} Product by id {% endblock %}

{% block content %}

{% if product %}
    <p>
        ID: {{product['id']}} <br>
        Name: {{product['name']}} <br>
        Price: {{product['price']}} <br>
        Content: {{product['content']}} <br>
    </p>
{% else %}
    <p>No information</p>
{% endif %}

{% endblock %}
