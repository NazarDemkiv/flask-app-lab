{% extends 'base.html' %}

{% block content %}

<h1>Контакти</h1>

<section class="resume-section">
    <h2>Як зі мною зв'язатися</h2>
    <p>Email: nazar.demkiv.24@pnu.edu.ua</p>
    <p>GitHub: https://github.com/NazarDemkiv/flask-app-lab</p>
</section>

<section class="resume-section">
    <h2>Написати повідомлення</h2>

    <form>
        <div class="mb-3">
            <label for="name" class="form-label">
                Ваше ім'я
            </label>
            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">
                Email
            </label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">
                Повідомлення
            </label>
            <textarea
                id="message"
                name="message"
                class="form-control"
                rows="5"
                required
            ></textarea>
        </div>

        <button type="button" class="btn btn-primary">
            Надіслати
        </button>
    </form>
</section>

{% endblock %}
